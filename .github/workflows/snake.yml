name: Generate ATLAS Contribution Matrix

on:
  schedule:
    # Execute every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

# Explicit least-privilege permissions
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate Snake Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Contribution Grid Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#8B9DFF&color_dots=#080b10,#111722,#202938,#5967A5,#8B9DFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#8B9DFF&color_dots=#080b10,#111722,#202938,#5967A5,#8B9DFF

      - name: Deploy Contribution Matrix to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
