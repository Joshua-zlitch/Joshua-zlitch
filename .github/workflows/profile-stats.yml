name: ATLAS Telemetry Sync

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate-telemetry.js"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-telemetry:
    name: Fetch Real GitHub Telemetry & Update SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Verified Telemetry SVGs
        run: node scripts/generate-telemetry.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Telemetry Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-telemetry.svg assets/top-languages.svg
          if git diff --staged --quiet; then
            echo "Telemetry is already up to date. No changes to commit."
          else
            git commit -m "chore(telemetry): update verified GitHub statistics [skip ci]"
            git push
            echo "Updated telemetry SVGs committed."
          fi
