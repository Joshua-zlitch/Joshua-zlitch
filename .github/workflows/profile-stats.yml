name: System Profile & Telemetry Sync

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/sync-profile.js"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-profile:
    name: Sync Commit Rankings & Telemetry SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Execute Profile Sync Engine
        run: node scripts/sync-profile.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-telemetry.svg assets/top-languages.svg
          if git diff --staged --quiet; then
            echo "Profile and telemetry are already up to date. No changes to commit."
          else
            git commit -m "chore(telemetry): update commit rankings and metrics [skip ci]"
            git push
            echo "Updated profile data and telemetry SVGs committed."
          fi
