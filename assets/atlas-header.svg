<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="230" fill="none">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes cycleMsg1 {
        0%, 20% { opacity: 1; visibility: visible; }
        25%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes cycleMsg2 {
        0%, 24% { opacity: 0; visibility: hidden; }
        25%, 45% { opacity: 1; visibility: visible; }
        50%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes cycleMsg3 {
        0%, 49% { opacity: 0; visibility: hidden; }
        50%, 70% { opacity: 1; visibility: visible; }
        75%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes cycleMsg4 {
        0%, 74% { opacity: 0; visibility: hidden; }
        75%, 96% { opacity: 1; visibility: visible; }
        99%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .cursor {
        animation: blink 0.9s infinite;
      }
      .msg-1 { animation: cycleMsg1 14s infinite; }
      .msg-2 { animation: cycleMsg2 14s infinite; }
      .msg-3 { animation: cycleMsg3 14s infinite; }
      .msg-4 { animation: cycleMsg4 14s infinite; }
      .live-dot { animation: pulseDot 2.2s infinite ease-in-out; }
      .mono {
        font-family: 'Monocraft', 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace;
      }
    </style>
    <!-- Subtle technical grid pattern -->
    <pattern id="techGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#111722" stroke-width="0.8" />
    </pattern>
    <!-- Linear gradient for accent divider -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B9DFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#5967A5" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#202938" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="230" rx="6" fill="#080B10" stroke="#202938" stroke-width="1.2" />
  <rect width="880" height="230" rx="6" fill="url(#techGrid)" />

  <!-- Corner Brackets (HUD Reticles) -->
  <path d="M 12 24 L 12 12 L 24 12" stroke="#5967A5" stroke-width="1.5" fill="none" />
  <path d="M 868 24 L 868 12 L 856 12" stroke="#5967A5" stroke-width="1.5" fill="none" />
  <path d="M 12 206 L 12 218 L 24 218" stroke="#5967A5" stroke-width="1.5" fill="none" />
  <path d="M 868 206 L 868 218 L 856 218" stroke="#5967A5" stroke-width="1.5" fill="none" />

  <!-- Top System Bar -->
  <rect x="26" y="16" width="828" height="26" rx="3" fill="#0D1219" stroke="#202938" stroke-width="0.8" />
  
  <!-- System Status Indicators -->
  <circle cx="42" cy="29" r="4" fill="#6EE7B7" class="live-dot" />
  <text x="54" y="33" fill="#6EE7B7" font-size="10" font-weight="600" class="mono" letter-spacing="1.2">SYSTEM.ONLINE</text>
  
  <text x="210" y="33" fill="#7A8294" font-size="10" class="mono">NODE // 0x7F-ATLAS</text>
  <text x="400" y="33" fill="#7A8294" font-size="10" class="mono">KERNEL // 5.14.0-R8</text>
  <text x="610" y="33" fill="#7A8294" font-size="10" class="mono">PROTO // AUTONOMOUS_OBSERVER</text>
  <text x="815" y="33" fill="#5967A5" font-size="10" font-weight="bold" class="mono">[REC]</text>

  <!-- Main Hero Brand Plate -->
  <!-- Pixel-block Monocraft glyph accent for ATLAS -->
  <g transform="translate(32, 60)">
    <!-- Subtitle Flag -->
    <rect x="0" y="0" width="138" height="15" rx="2" fill="#111722" stroke="#202938" stroke-width="0.7" />
    <text x="6" y="11" fill="#8B9DFF" font-size="8.5" font-weight="700" class="mono" letter-spacing="1.5">INTERFACE // SPEC 01</text>

    <!-- Main Title -->
    <text x="0" y="44" fill="#D8DCE7" font-size="28" font-weight="800" class="mono" letter-spacing="3">
      ATLAS <tspan fill="#8B9DFF">//</tspan> <tspan fill="#8B9DFF">JOSHUA</tspan>
    </text>

    <!-- Descriptor -->
    <text x="2" y="64" fill="#7A8294" font-size="11.5" class="mono" letter-spacing="1">
      AUTONOMOUS REPOSITORY OBSERVATION &amp; TELEMETRY CONSOLE
    </text>
  </g>

  <!-- Right Side Telemetry Matrix -->
  <g transform="translate(620, 60)">
    <rect x="0" y="0" width="232" height="74" rx="4" fill="#0D1219" stroke="#202938" stroke-width="1" />
    <text x="12" y="18" fill="#5967A5" font-size="9" font-weight="700" class="mono" letter-spacing="1">TELEMETRY MATRIX</text>
    
    <text x="12" y="36" fill="#7A8294" font-size="10" class="mono">SYNC STATUS</text>
    <text x="160" y="36" fill="#6EE7B7" font-size="10" font-weight="600" class="mono">CONNECTED</text>
    
    <text x="12" y="51" fill="#7A8294" font-size="10" class="mono">INDEX ACCURACY</text>
    <text x="178" y="51" fill="#D8DCE7" font-size="10" class="mono">100.0%</text>
    
    <text x="12" y="66" fill="#7A8294" font-size="10" class="mono">MACHINE VOICE</text>
    <text x="186" y="66" fill="#8B9DFF" font-size="10" class="mono">CLINICAL</text>
  </g>

  <!-- Accent Divider Trace -->
  <line x1="26" y1="152" x2="854" y2="152" stroke="url(#accentGrad)" stroke-width="1.2" />

  <!-- Animated Terminal Activity Line -->
  <rect x="26" y="165" width="828" height="46" rx="3" fill="#0D1219" stroke="#202938" stroke-width="0.9" />
  
  <!-- Terminal Prompt -->
  <text x="40" y="193" fill="#8B9DFF" font-size="12" font-weight="700" class="mono">atlas@core:~$</text>
  
  <!-- Cycling System Messages -->
  <g transform="translate(162, 193)">
    <!-- Message 1 -->
    <g class="msg-1">
      <text x="0" y="0" fill="#D8DCE7" font-size="11.5" class="mono" letter-spacing="0.5">
        SYSTEM INITIALIZED // PROFILE NODE ONLINE ...................... <tspan fill="#6EE7B7">[OK]</tspan>
      </text>
    </g>
    <!-- Message 2 -->
    <g class="msg-2">
      <text x="0" y="0" fill="#D8DCE7" font-size="11.5" class="mono" letter-spacing="0.5">
        DEVELOPER PROCESS DETECTED // TELEMETRY LINK ESTABLISHED ........ <tspan fill="#6EE7B7">[OK]</tspan>
      </text>
    </g>
    <!-- Message 3 -->
    <g class="msg-3">
      <text x="0" y="0" fill="#D8DCE7" font-size="11.5" class="mono" letter-spacing="0.5">
        OBSERVATION MODE ENABLED // MONITORING ARTIFACT COMMITS ......... <tspan fill="#8B9DFF">[ACTIVE]</tspan>
      </text>
    </g>
    <!-- Message 4 -->
    <g class="msg-4">
      <text x="0" y="0" fill="#D8DCE7" font-size="11.5" class="mono" letter-spacing="0.5">
        ACTIVITY STREAM CONNECTED // REPOSITORIES INDEXED ............... <tspan fill="#6EE7B7">[READY]</tspan>
      </text>
    </g>
  </g>
  
  <!-- Blinking Cursor -->
  <rect x="834" y="181" width="7" height="14" fill="#8B9DFF" class="cursor" />
</svg>
