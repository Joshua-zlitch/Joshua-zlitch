<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 195" width="100%" height="195" fill="none">
  <defs>
    <style>
      .mono { font-family: 'Monocraft', 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .lbl { font-size: 10px; fill: #7A8294; letter-spacing: 0.5px; }
      .val { font-size: 11px; font-weight: 700; fill: #D8DCE7; letter-spacing: 0.5px; }
      .pri { fill: #8B9DFF; }
    </style>
    <pattern id="langGrid" width="15" height="15" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 0 0 0 15" fill="none" stroke="#111722" stroke-width="0.8" />
    </pattern>
  </defs>

  <!-- Frame Background -->
  <rect width="430" height="195" rx="5" fill="#080B10" stroke="#202938" stroke-width="1.2" />
  <rect width="430" height="195" rx="5" fill="url(#langGrid)" />

  <!-- Corner Reticles -->
  <path d="M 8 18 L 8 8 L 18 8" stroke="#5967A5" stroke-width="1.2" fill="none" />
  <path d="M 422 18 L 422 8 L 412 8" stroke="#5967A5" stroke-width="1.2" fill="none" />
  <path d="M 8 177 L 8 187 L 18 187" stroke="#5967A5" stroke-width="1.2" fill="none" />
  <path d="M 422 177 L 422 187 L 412 187" stroke="#5967A5" stroke-width="1.2" fill="none" />

  <!-- Top Title Strip -->
  <rect x="20" y="16" width="390" height="26" rx="3" fill="#0D1219" stroke="#202938" stroke-width="0.8" />
  <circle cx="34" cy="29" r="3.5" fill="#8B9DFF" />
  <text x="44" y="33" class="mono pri" font-size="10" font-weight="700" letter-spacing="1">SYSTEM // LANGUAGE DISTRIBUTION</text>
  <text x="340" y="33" class="mono lbl" font-size="9.5">BYTE-WEIGHTED</text>

  <!-- Language Bars -->
  <g transform="translate(24, 0)">
    
    <text x="0" y="74" class="mono lbl">PYTHON</text>
    <rect x="140" y="65" width="160" height="9" rx="2" fill="#0D1219" stroke="#202938" stroke-width="0.6" />
    <rect x="140" y="65" width="65" height="9" rx="2" fill="#8B9DFF" />
    <text x="370" y="74" class="mono val" font-size="11" text-anchor="end">40.3%</text>
    
    <text x="0" y="92" class="mono lbl">TYPESCRIPT</text>
    <rect x="140" y="83" width="160" height="9" rx="2" fill="#0D1219" stroke="#202938" stroke-width="0.6" />
    <rect x="140" y="83" width="43" height="9" rx="2" fill="#5967A5" />
    <text x="370" y="92" class="mono val" font-size="11" text-anchor="end">27.1%</text>
    
    <text x="0" y="110" class="mono lbl">DART</text>
    <rect x="140" y="101" width="160" height="9" rx="2" fill="#0D1219" stroke="#202938" stroke-width="0.6" />
    <rect x="140" y="101" width="29" height="9" rx="2" fill="#6EE7B7" />
    <text x="370" y="110" class="mono val" font-size="11" text-anchor="end">18.4%</text>
    
    <text x="0" y="128" class="mono lbl">RUST</text>
    <rect x="140" y="119" width="160" height="9" rx="2" fill="#0D1219" stroke="#202938" stroke-width="0.6" />
    <rect x="140" y="119" width="7" height="9" rx="2" fill="#F4C95D" />
    <text x="370" y="128" class="mono val" font-size="11" text-anchor="end">4.6%</text>
    
    <text x="0" y="146" class="mono lbl">JAVASCRIPT</text>
    <rect x="140" y="137" width="160" height="9" rx="2" fill="#0D1219" stroke="#202938" stroke-width="0.6" />
    <rect x="140" y="137" width="7" height="9" rx="2" fill="#A78BFA" />
    <text x="370" y="146" class="mono val" font-size="11" text-anchor="end">4.6%</text>
    
    <text x="0" y="164" class="mono lbl">OTHER</text>
    <rect x="140" y="155" width="160" height="9" rx="2" fill="#0D1219" stroke="#202938" stroke-width="0.6" />
    <rect x="140" y="155" width="8" height="9" rx="2" fill="#4B5563" />
    <text x="370" y="164" class="mono val" font-size="11" text-anchor="end">5.0%</text>
    
  </g>

  <!-- Bottom Hairline -->
  <line x1="20" y1="172" x2="410" y2="172" stroke="#202938" stroke-width="0.8" />
  <text x="24" y="184" class="mono lbl" font-size="8.5">CALCULATED ACROSS ALL PUBLIC REPOSITORIES</text>
  <text x="406" y="184" class="mono pri" font-size="8.5" text-anchor="end">PRIMARY: PYTHON</text>
</svg>